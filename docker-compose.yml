services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: easypool
      POSTGRES_USER: easypool
      POSTGRES_PASSWORD: easypool
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: